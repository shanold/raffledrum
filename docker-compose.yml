services:
  raffle-drum:
    build: .
    container_name: raffle-drum
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      LOCK_ENABLED: "${LOCK_ENABLED:-true}"
      ORGANIZER_PASSWORD_HASH: "${ORGANIZER_PASSWORD_HASH:-}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
    volumes:
      - ./data:/data
